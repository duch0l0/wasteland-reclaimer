# Тесты: все тест-скрипты по одному + бот по первому акту.
# Скрипты в tests/ — самостоятельные программы (sys.exit в конце), поэтому запускаем циклом,
# а не через unittest discover: он падает на sys.exit при импорте модуля.
name: Тесты

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      # без фиксированного хеша порядок обхода множеств меняется от запуска к запуску
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Сборка без окна (--smoke)
        run: python main.py --smoke

      - name: Все тест-скрипты по одному
        shell: bash
        run: |
          fail=0
          for t in tests/test_*.py; do
            log="/tmp/$(basename "$t").log"
            if python "$t" > "$log" 2>&1; then
              echo "OK   $t"
            else
              echo "ПРОВАЛ $t"
              tail -40 "$log"
              fail=1
            fi
          done
          exit "$fail"

      - name: Бот по первому акту + отчёт
        run: python tools/playthrough.py act1 --seed 3 --stats act1.json

      - name: Отчёт бота
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: act1-stats
          path: act1.json
          if-no-files-found: warn
