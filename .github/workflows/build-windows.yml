# Сборка WastelandReclaimer.exe на Windows-машине GitHub.
# Запуск: вкладка Actions → «Сборка exe для Windows» → Run workflow,
# или автоматически при теге вида v0.1 (тогда exe прикрепляется к релизу).
# Готовый exe — внизу страницы запуска, в разделе Artifacts.
name: Сборка exe для Windows

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Сборка
        run: pyinstaller --noconfirm WastelandReclaimer.spec

      - name: Проверка — exe загружает город и сохраняется
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\WastelandReclaimer.exe -ArgumentList "--smoke" -Wait -PassThru
          if ($p.ExitCode -ne 0) { if (Test-Path dist\crash.log) { Get-Content dist\crash.log }; exit 1 }
          if (-not (Test-Path dist\saves\quick.json)) { exit 1 }
          Remove-Item -Recurse dist\saves

      - uses: actions/upload-artifact@v4
        with:
          name: WastelandReclaimer-windows
          path: dist/WastelandReclaimer.exe

      - name: Релиз (только для тегов v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/WastelandReclaimer.exe
